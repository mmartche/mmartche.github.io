about:
  title: Nosso Time
  description: Reúnimos uma equipe de designers, desenvolvedores web e apps, especialistas em SEO, Engenheiros & Seguranças em Servidores para cada projeto, garantindo-lhe obter a melhor mistura de talento e especialistas experientes.
  info:
    - Martche House reúne uma equipe de designers, desenvolvedores web e apps, especialistas em SEO, Engenheiros & Seguranças em Servidores para cada projeto, garantindo-lhe obter a melhor mistura de talento e especialistas experientes.
    - A equipe Martche House têm trabalhado juntos com grandes empresas há mais de 15 anos. Acreditamos que ajuda e apoio é vital ao desenvolvimento orientado, no mundo não humano. Gostamos de pensar que somos inteligentes e social e isso reflete em nosso espírito de equipe.
    - Nós amamos projetos desafiadores para ajudar nas tarefas de apoio mais humildes! Gostar de ajudar é parte da nossa forma de trabalhar com os clientes.
    - A Martche House é uma empresa focada em consultoria e serviços voltados ao Open Source, onde existe uma comunidade apaixonada a qual seguimos a longos anos.
    - Pensamos e desenvolvemos técnicas para enfrentar os maiores desafios de nossos clientes, procuramos buscar as melhores tecnologias do mercado na comunidade Open Source para que possamos atender os que buscam uma solução de qualidade.
    - Nossa maior preocupação é suportar o cliente através de tecnologias que cumprem essa necessidade.

