---
layout: contact
title: Contato
permalink: /contact/
translations:
  pt: /contact/
  en: /en/contact/
---

<div id="contactwrap"></div>

<div class="container mtb">
  <div class="row">{% tf contact.markdown %}</div>
</div>
<div class="container mtb">
  <div class="row">
    <div class="col-lg-9">
      <h4>{% t contact.title %}</h4>
      <div class="hline"></div>
      <p>{% t contact.description %}</p>
      <form
        action="https://formspree.io/f/xjygyeyn"
        method="POST"
        id="contact-form"
      >
        <div class="form-group">
          <label for="name">{% t contact.name %}</label>
          <input
            type="text"
            id="name"
            name="name"
            class="form-control"
            required
          />
        </div>

        <div class="form-group">
          <label for="email">{% t contact.email %}</label>
          <input
            type="email"
            id="email"
            name="email"
            class="form-control"
            required
          />
        </div>

        <div class="form-group">
          <label for="subject">{% t contact.subject %}</label>
          <input type="text" id="subject" name="subject" class="form-control" />
        </div>

        <div class="form-group">
          <label for="message">{% t contact.message %}</label>
          <textarea
            id="message"
            name="message"
            class="form-control"
            rows="7"
            required
          ></textarea>
        </div>
        <input
          type="text"
          name="_gotcha"
          style="display: none"
          tabindex="-1"
          autocomplete="off"
        />
        <button type="submit" class="btn btn-theme" id="contact-submit">
          {% t contact.send %}
        </button>
      </form>
      <div
        id="contact-status"
        role="status"
        aria-live="polite"
        data-sending="{% t contact.sending %}"
        data-success="{% t contact.success %}"
        data-error="{% t contact.error %}"
        data-network-error="{% t contact.network_error %}"
        style="margin-top: 15px"
      ></div>
    </div>
    <div class="col-lg-3">
      <h4>{% t contact.subtitle %}</h4>
      <div class="hline"></div>
      <p>{% t contact.info %}</p>
      <p>
        email: <a href="mailto:mmartche@hotmail.com">mmartche@hotmail.com</a>
      </p>
    </div>
  </div>
</div>
<script>
  document.addEventListener("DOMContentLoaded", function () {
    const form = document.getElementById("contact-form");
    const status = document.getElementById("contact-status");
    const submitButton = document.getElementById("contact-submit");

    if (!form || !status || !submitButton) {
      return;
    }

    form.addEventListener("submit", async function (event) {
      event.preventDefault();

      status.textContent = status.dataset.sending;
      submitButton.disabled = true;

      try {
        const response = await fetch(form.action, {
          method: form.method,
          body: new FormData(form),
          headers: {
            Accept: "application/json",
          },
        });
        if (response.ok) {
          status.textContent = status.dataset.success;
          status.className = "success";
          status.style.display = "block";
          form.reset();
        } else {
          const data = await response.json();
          if (data.errors) {
            status.textContent = data.errors
              .map((error) => error.message)
              .join(", ");
          } else {
            status.textContent = status.dataset.error;
          }
          status.textContent = status.dataset.error;
          status.className = "error";
          status.style.display = "block";
        }
      } catch (error) {
        status.textContent = status.dataset.networkError;
      } finally {
        submitButton.disabled = false;
      }
    });
  });
</script>
