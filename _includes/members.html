<div class="container mtb">
    <div class="row centered">
        <h2 class="mb">{% t team.title %}</h2>
        
        {% assign members = site.translations[site.lang].members %}
        {% for member in members %}

        <div class="col-lg-3 col-md-3 col-sm-3">
            <div class="he-wrap tpl6">
            <img src="{{ "/assets/img/members/" | prepend: site.baseurl_root  }}{{ member.img }}" alt="{{ member.name }}" loading="lazy" decoding="async">
                <div class="he-view">
                     <div class="bg a0" data-animate="fadeIn">
                        <h4 class="a1" data-animate="fadeInDown">{% t team.contact_me %}</h4>
                        {% for entry in member.social %}
                            <a href="{{ entry.url }}" class="dmbutton a2" data-animate="fadeInUp" target="_blank"><i class="fa fa-{{ entry.icon }}"></i></a>
                        {% endfor %}
                    </div><!-- he bg -->
                </div><!-- he view -->		
            </div><!-- he wrap -->
            <h4>{{ member.name }}</h4>
            <h5 class="ctitle">{{ member.position }}</h5>
            <p>{{ member.text }}</p>
            <div class="hline"></div>
        </div>
        {% endfor %}
        
    </div>
</div>
