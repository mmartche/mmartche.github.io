<div id="footerwrap">
    <div class="container">
        <div class="row">
            {% assign footers = site.translations[site.lang].footer %}
            {% for footer in footers %}
            <div class="col-lg-4">
                <h4>{{ footer.title }}</h4>
                <div class="hline-w"></div>
                <p>{{ footer.description }}</p>
            </div>
            {% endfor %}
        </div>
    </div>
</div>
