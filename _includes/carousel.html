<div class="col-lg-10 col-lg-offset-1 centered">
    <div id="carousel-example-generic" class="carousel slide" data-ride="carousel">
        <!-- Indicators -->
        <ol class="carousel-indicators">
            {% for img in page.carousel %}
                <li data-target="#carousel-example-generic" data-slide-to="{{ forloop.index0 }}" 
                {% if forloop.index0 == 0 %}
                    class="active"
                {% endif %}>
                </li>
            {% endfor %}
        </ol>

        <!-- Wrapper for slides -->
        <div class="carousel-inner">
            {% for img in page.carousel.first %}
                <div class="item active">
                    <img 
                        src="{{ "/assets/img/project" | prepend: site.baseurl_root  }}{{ img }}" 
                        alt="{{ page.title | escape }}{% if forloop.index > 1 %} - {{ forloop.index }}{% endif %}"
                        {% unless forloop.first %}loading="lazy"{% endunless %}
                        decoding="async"
                    >
                </div>
            {% endfor %}
            {% for img in page.carousel offset:1 %}
                <div class="item">
                    <img 
                        src="{{ "/assets/img/project" | prepend: site.baseurl_root  }}{{ img }}" 
                        alt="{{ page.title | escape }}{% if forloop.index > 1 %} - {{ forloop.index }}{% endif %}"
                        {% unless forloop.first %}loading="lazy"{% endunless %}
                        decoding="async"
                    >
                </div>
            {% endfor %}
        </div>
    </div> <!--/Carousel -->
</div>
